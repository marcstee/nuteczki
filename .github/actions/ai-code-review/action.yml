name: AI Code Review
description: >
  Run an advisory AI code review on a PR and surface the result as a sticky
  comment plus exactly one review/* verdict label. Uses the in-repo
  @nuteczki/code-reviewer agent; all GitHub side-effects are handled by
  actions/github-script so no external action needs write access.

inputs:
  anthropic_api_key:
    required: true
    description: Anthropic API key passed to the review agent.
  github_token:
    required: true
    description: GitHub token with pull-requests:write and issues:write.
  model:
    required: false
    default: claude-sonnet-4-6
    description: Model id for the review agent.
  base_sha:
    required: false
    description: Base commit SHA for the diff range (PR base).
  head_sha:
    required: false
    description: Head commit SHA for the diff range (PR head).

runs:
  using: composite
  steps:
    # ── 1. Produce the diff and changed-file list ─────────────────────────────
    - name: Compute diff
      shell: bash
      run: |
        git diff "${{ inputs.base_sha }}...${{ inputs.head_sha }}" \
          > "$RUNNER_TEMP/pr.diff"
        git diff --name-only "${{ inputs.base_sha }}...${{ inputs.head_sha }}" \
          > "$RUNNER_TEMP/pr-files.txt"
        echo "Diff size: $(wc -c < "$RUNNER_TEMP/pr.diff") bytes"
        echo "Changed files:"
        cat "$RUNNER_TEMP/pr-files.txt"

    # ── 2. Install reviewer package deps ──────────────────────────────────────
    - name: Install reviewer dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/packages/code-reviewer
      run: npm ci

    # ── 3. Run the AI review ──────────────────────────────────────────────────
    - name: Run AI review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        PR_FILES="$(tr '\n' ',' < "$RUNNER_TEMP/pr-files.txt" | sed 's/,$//')"

        INSTRUCTION="Review this pull request.

        PR title: ${PR_TITLE}
        Changed files: ${PR_FILES}

        Please Read the full diff at $RUNNER_TEMP/pr.diff and any surrounding
        source files you need for context. Pay attention to the high-risk
        surfaces: src/pages/api/, src/components/drill/, src/components/staff/."

        cd "$GITHUB_WORKSPACE/packages/code-reviewer"
        REVIEW_EXIT=0
        npm run review -- "$INSTRUCTION" \
          --project-settings \
          --model "${{ inputs.model }}" \
          --json \
          > "$RUNNER_TEMP/review.json" \
          2> "$RUNNER_TEMP/review.stderr" \
          || REVIEW_EXIT=$?

        # Extract cost and turns from the summary line on stderr.
        # Format: "— outcome · N turns · $X.XXXX [ · session <id>]"
        LAST="$(tail -1 "$RUNNER_TEMP/review.stderr" 2>/dev/null || true)"
        TURNS="$(echo "$LAST" | grep -oP '\d+(?= turns)' || true)"
        COST="$(echo "$LAST" | grep -oP '(?<=\$)\d+\.\d+' || true)"
        echo "REVIEW_TURNS=${TURNS}" >> "$GITHUB_ENV"
        echo "REVIEW_COST=${COST}"   >> "$GITHUB_ENV"
        echo "Review exited: $REVIEW_EXIT"

    # ── 4. Render verdict + comment markdown from the JSON report ─────────────
    - name: Render comment and verdict
      shell: bash
      env:
        REVIEW_JSON_PATH: ${{ runner.temp }}/review.json
        VERDICT_PATH: ${{ runner.temp }}/verdict.txt
        COMMENT_PATH: ${{ runner.temp }}/comment.md
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        cd "$GITHUB_WORKSPACE/packages/code-reviewer"
        npx tsx src/render-for-ci.ts

    # ── 5. Post comment, swap verdict label, consume retry ────────────────────
    - name: Post comment and apply verdict label
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');

          const verdictFile = `${process.env.RUNNER_TEMP}/verdict.txt`;
          const commentFile = `${process.env.RUNNER_TEMP}/comment.md`;

          const verdict = fs.existsSync(verdictFile)
            ? fs.readFileSync(verdictFile, 'utf8').trim()
            : 'error';

          const commentBody = fs.existsSync(commentFile)
            ? fs.readFileSync(commentFile, 'utf8')
            : '<!-- ai-code-review -->\n## AI Code Review — ❌ Review Error\n\nThe review pipeline failed to produce a report.\n';

          const { repo } = context;
          const issue_number = context.issue.number;

          // Consume the retry label as the very first action so every run
          // removes it regardless of whether this is a retry or not.
          try {
            await github.rest.issues.removeLabel({ ...repo, issue_number, name: 'review/retry' });
          } catch (e) { if (e.status !== 404) throw e; }

          // Ensure all five labels exist before we try to apply them.
          const LABEL_COLORS = {
            'review/pass':              '0e8a16',
            'review/comment':           '0075ca',
            'review/changes-requested': 'd93f0b',
            'review/error':             'e4e669',
            'review/retry':             'bfd4f2',
          };
          for (const [name, color] of Object.entries(LABEL_COLORS)) {
            try {
              await github.rest.issues.createLabel({ ...repo, name, color });
            } catch (e) { if (e.status !== 422) throw e; }
          }

          // Idempotent sticky comment: update existing or create new.
          const MARKER = '<!-- ai-code-review -->';
          const allComments = await github.paginate(
            github.rest.issues.listComments,
            { ...repo, issue_number, per_page: 100 },
          );
          const existing = allComments.find(c => c.body && c.body.includes(MARKER));
          if (existing) {
            await github.rest.issues.updateComment({
              ...repo, comment_id: existing.id, body: commentBody,
            });
          } else {
            await github.rest.issues.createComment({ ...repo, issue_number, body: commentBody });
          }

          // Single verdict label: remove the other three, then add the desired one.
          const VERDICT_LABELS = [
            'review/pass',
            'review/comment',
            'review/changes-requested',
            'review/error',
          ];
          const desired = `review/${verdict}`;
          for (const name of VERDICT_LABELS.filter(l => l !== desired)) {
            try {
              await github.rest.issues.removeLabel({ ...repo, issue_number, name });
            } catch (e) { if (e.status !== 404) throw e; }
          }
          await github.rest.issues.addLabels({ ...repo, issue_number, labels: [desired] });
